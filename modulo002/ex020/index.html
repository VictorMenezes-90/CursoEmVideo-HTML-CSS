<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Links</title>
        <style>
            *{
                font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            }

            a{
                font-weight: 600;
                text-decoration: none;
                color: rgb(0,0,255);
            }

            a:hover, a:hover::before, a:hover::after{
                color: rgb(255,0,0);
                text-decoration: underline;
            }

            a:visited{
                color: rgb(150,0,0);
            }

            a:active{
                color: rgb(0,255,0);
            }

            a::before{
                content: ">> ";
                color: rgb(0,0,150); 
            }

            a::after{
                content: " [Link]";
                font-size: 0.75em;
                color: rgb(0,0,150);
            }

            .Navegador {
                position: absolute;
                top: 0;
                right: 0;
                padding: 5px 10px;

                background-color:rgb(127, 0, 255);
                border-bottom-left-radius: 15px;
                color: white;
                font: bold 1.25rem Arial;
            }
            .Navegador a{
                margin-left: 5px;
                color: white;
                font: bold 0.75rem Arial;
            }
            .Navegador a:hover{
                color: yellow;
            }

            .Navegador a::before, .Navegador a::after {content: none;}
        </style>
    </head>
    <body>
        <div class="Navegador">Exercício 20 <a href="../ex021">Próximo</a></div>

        <h1>Personalizando LINKS</h1>

        <ul>
            <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório do GitHub</a></li>
            <li><a href="https://www.youtube.com/cursoemvideo/" target="_blank">Canal do YouTube</a></li>
            <li><a href="https://www.cursoemvideo.com" target="_blank">Site do Curso em Vídeo</a></li>
        </ul>
    </body>
</html>
