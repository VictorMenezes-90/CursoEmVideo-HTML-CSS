<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imagem Flexível</title>
        <link rel="icon" type="image/x-icon" href="../multimidia/favicons/d01-favicon.ico">
        <style>
            .Navegador {
                position: absolute;
                top: 0;
                right: 0;
                padding: 5px 10px;

                background-color:rgb(0, 0, 255);
                border-bottom-left-radius: 15px;
                color: white;
                font: bold 1.25rem Arial;
            }
            .Navegador a{
                margin-left: 5px;
                color: white;
                font: bold 0.75rem Arial;
            }
            .Navegador a:hover{
                color: yellow;
            }
        </style>
    </head>
    <body>
        <div class="Navegador">Desafio 7 <a href="../desafio008/">Próximo</a></div>
        
        <div style="margin-left: 10px; margin-right: 10px;">
            <h1>Imagem Flexível</h1>
            <p>Em HTML5, podemos inserir imagens que se adaptam ao tamanho da tela. Experimente aumentar o tamanho da janela do navegador para ver a imagem completa &#x1F92F</p>
            
            <picture>
                <source  media="(max-width: 740px)" srcset="../multimidia/imagens/d07-paisagem-p.png" type="image/png">
                <source  media="(max-width: 1200px)" srcset="../multimidia/imagens/d07-paisagem-m.png" type="image/png">
                <img src="../multimidia/imagens/d07-paisagem-g.png" alt="Paisagem Montanhosa">
            </picture>
        </div>
   </body>
</html>
