<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imagens de Fundo do Site</title>
        <style>
            .bloco {
                margin: 5px 0;
                height: 200px;
                border: 1px solid black;
                border-radius: 10px;

                background-image: url('../multimidia/wallpaper003.jpg');
            }

            #b1 {
                background-position: left top;
            }

            #b2 {
                background-position: left center;
            }

            #b3 {
                background-position: right bottom;
            }

            #b4 {
                background-position: center;
            }

            .Navegador {
                position: absolute;
                top: 0;
                right: 0;
                padding: 5px 10px;

                background-color:rgb(0, 230, 255);
                border-bottom-left-radius: 15px;
                color: white;
                font: bold 1.25rem Arial;
            }
            .Navegador a{
                margin-left: 5px;
                color: white;
                font: bold 0.75rem Arial;
            }
            .Navegador a:hover{
                color: yellow;
            }
        </style>
    </head>
    <body>
        <div class="Navegador">Exercício 22 <a href="../ex023">Próximo</a></div>

        <div class="bloco" id="b1"></div>
        <div class="bloco" id="b2"></div>
        <div class="bloco" id="b3"></div>
        <div class="bloco" id="b4"></div>
    </body>
</html>
