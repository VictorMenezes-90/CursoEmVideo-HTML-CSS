<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imagens de Fundo do Site</title>
        <style>
            body {
                background-image: url('https://gustavoguanabara.github.io/html-css/imagens/mascote.png');
                background-size: 100px 100px;
                background-repeat: repeat;
            }
            .Navegador {
                position: absolute;
                top: 0;
                right: 0;
                padding: 5px 10px;

                background-color:rgb(0, 230, 255);
                border-bottom-left-radius: 15px;
                color: white;
                font: bold 1.25rem Arial;
            }
            .Navegador a{
                margin-left: 5px;
                color: white;
                font: bold 0.75rem Arial;
            }
            .Navegador a:hover{
                color: yellow;
            }
        </style>
    </head>
    <body>
        <div class="Navegador">Exercício 22 <a href="../ex023">Próximo</a></div>
    </body>
</html>
