<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Alinhamento Vertical</title>
        <style>
            #container {
                background-image: url(../multimidia/target001.png);
                background-size: 100% 100%;
                height: 95dvh;
                padding: 10px;
                background-color: purple;

                position: relative;
            }

            #conteudo {
                background-image: url(../multimidia/target001.png);
                background-size: 100% 100%;
                height: 200px;
                width: 300px;
                background-color: yellow;

                position: absolute;
                left: 50%;
                top: 50%;

                transform: translate(-50%, -50%);
            }

            .Navegador {
                position: absolute;
                top: 0;
                right: 0;
                z-index: 2;
                padding: 5px 10px;

                background-color:rgb(0, 230, 255);
                border-bottom-left-radius: 15px;
                color: white;
                font: bold 1.25rem Arial;
            }
            .Navegador a{
                margin-left: 5px;
                color: white;
                font: bold 0.75rem Arial;
            }
            .Navegador a:hover{
                color: yellow;
            }
        </style>
    </head>
    <body>
        <div class="Navegador">Exercício 22 <a href="../ex023">Próximo</a></div>
        <section id="container">
            <article id="conteudo"></article>
        </section>
    </body>
</html>
