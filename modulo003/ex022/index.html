<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Imagens no Fundo do Site</title>
        <style>
            .quadrado {
                display: inline-block;

                width: 200px;
                height: 200px;

                border: 1px solid black;
                border-radius: 10px;
                background-color: lightcyan;
            }

            #q01 {
                background-color: yellow;
            }

            #q02 {
                background-image: radial-gradient(orange, red);
            }

            #q03 {
                background-image: url('../multimidia/pattern003.png');
            }

            body {
                background-image: url('../multimidia/wallpaper001.jpg');
            }

            .Navegador {
                position: absolute;
                top: 0;
                right: 0;
                padding: 5px 10px;

                background-color:rgb(0, 230, 255);
                border-bottom-left-radius: 15px;
                color: white;
                font: bold 1.25rem Arial;
            }
            .Navegador a{
                margin-left: 5px;
                color: white;
                font: bold 0.75rem Arial;
            }
            .Navegador a:hover{
                color: yellow;
            }
        </style>
    </head>
    <body>
        <div class="Navegador">Exercício 22 <a href="../ex023">Próximo</a></div>
        
        <div class="quadrado" id="q01"></div>
        <div class="quadrado" id="q02"></div>
        <div class="quadrado" id="q03"></div>
    </body>
</html>
